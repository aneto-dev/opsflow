{% if can_decide %}

<div class="decision-card">

    <h3>Record Decision</h3>

    <form
        method="post"
        action="{% url 'workflow-decision' active_step.id %}"
    >

        {% csrf_token %}

        <div class="form-group">
            {{ decision_form.decision }}
        </div>

        <div class="form-group">
            {{ decision_form.comment }}
        </div>

        <button
            type="submit"
            class="btn-primary"
        >
            Submit Decision
        </button>

    </form>

</div>

{% endif %}

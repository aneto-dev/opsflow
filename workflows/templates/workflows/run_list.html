<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Runs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background: #f9fafb;
            color: #111827;
        }

        h1 {
            margin-bottom: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 0.9rem 1rem;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f3f4f6;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .badge.in_progress {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge.completed {
            background: #d1fae5;
            color: #065f46;
        }
    </style>
</head>
<body>
    <h1>Workflow Runs</h1>

    <table>
        <thead>
            <tr>
                <th>Reference</th>
                <th>Workflow</th>
                <th>Status</th>
                <th>Started By</th>
                <th>Started At</th>
            </tr>
        </thead>
        <tbody>
            {% for run in runs %}
            <tr>
                <td>{{ run.reference }}</td>
                <td>{{ run.workflow.name }}</td>
                <td>
                    <span class="badge {{ run.status }}">
                        {{ run.get_status_display }}
                    </span>
                </td>
                <td>{{ run.started_by }}</td>
                <td>{{ run.started_at }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No workflow runs found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
